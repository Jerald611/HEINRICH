<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Floral Brochure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #f3e5f5 100%);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Background falling flowers container */
        #flower-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .falling-flower {
            position: absolute;
            top: -50px;
            user-select: none;
            animation: fall linear infinite;
            opacity: 0.85;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg) translateX(0px);
            }
            50% {
                transform: translateY(50vh) rotate(180deg) translateX(25px);
            }
            100% {
                transform: translateY(105vh) rotate(360deg) translateX(-25px);
            }
        }

        /* Click burst flowers & cursor trail */
        .burst-flower, .trail-flower {
            position: fixed;
            pointer-events: none;
            z-index: 999;
        }

        .burst-flower {
            font-size: 1.5rem;
            animation: burst 1s ease-out forwards;
        }

        .trail-flower {
            font-size: 1rem;
            animation: fadeTrail 0.8s ease-out forwards;
        }

        @keyframes burst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.5) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(240deg);
            }
        }

        @keyframes fadeTrail {
            0% {
                opacity: 0.9;
                transform: translate(-50%, -50%) scale(0.8);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -80%) scale(0.3) rotate(90deg);
            }
        }

        /* Glassmorphism brochure card */
        .brochure-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(216, 27, 96, 0.16);
            border: 2px solid rgba(255, 255, 255, 0.95);
            max-width: 620px;
            width: 100%;
            text-align: center;
            z-index: 1;
            transition: transform 0.15s ease-out;
        }

        h1 {
            color: #ad1457;
            margin-bottom: 6px;
            font-size: 2.1rem;
        }

        .subtitle {
            color: #7b1fa2;
            font-size: 0.95rem;
            margin-bottom: 18px;
        }

        /* Audio Upload Box */
        .audio-box {
            background: #fff5f8;
            border: 1px dashed #f48fb1;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .audio-label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #ad1457;
            cursor: pointer;
            background: #fce4ec;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #f48fb1;
            transition: all 0.2s ease;
        }

        .audio-label:hover {
            background: #f8bbd0;
            transform: scale(1.03);
        }

        #audioUpload {
            display: none;
        }

        #audioPlayer {
            width: 100%;
            height: 36px;
            display: none;
        }

        /* Interactive Top Control Bar */
        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fce4ec;
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .progress-text {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ad1457;
        }

        .control-buttons {
            display: flex;
            gap: 8px;
        }

        .mini-btn {
            background: #fff;
            color: #c2185b;
            border: 1px solid #f48fb1;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mini-btn:hover {
            background: #f8bbd0;
            transform: scale(1.05);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-box {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #f8bbd0;
            text-align: left;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.3s ease;
        }

        .option-box.opened {
            border-color: #ec407a;
        }

        .option-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(233, 30, 99, 0.18);
        }

        .btn {
            background: linear-gradient(90deg, #ec407a, #ab47bc);
            color: #fff;
            border: none;
            width: 100%;
            padding: 16px 20px;
            font-size: 1.02rem;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: filter 0.3s ease;
        }

        .btn:hover {
            filter: brightness(1.08);
        }

        .hidden-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.25, 1, 0.5, 1), padding 0.4s ease;
            padding: 0 20px;
            background: #fff9fb;
            color: #4a4a4a;
            font-size: 0.96rem;
            line-height: 1.6;
        }

        .option-box.active .hidden-content {
            max-height: 220px;
            padding: 18px 20px;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            align-items: center;
        }

        .copy-btn, .heart-btn {
            background: #fce4ec;
            color: #c2185b;
            border: 1px solid #f48fb1;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover, .heart-btn:hover {
            background: #f8bbd0;
            transform: scale(1.05);
        }

        .heart-btn.liked {
            background: #e91e63;
            color: #fff;
            border-color: #e91e63;
        }

        .arrow {
            transition: transform 0.35s ease;
            font-size: 1.1rem;
        }

        .option-box.active .arrow {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>

    <!-- Container for falling flowers -->
    <div id="flower-bg"></div>

    <div class="brochure-card" id="brochureCard">
        <h1>🌸 Choose an Option 🌸</h1>
        <p class="subtitle">Move your cursor, bloom flowers, and explore every message!</p>

        <!-- Background Music Upload & Player -->
        <div class="audio-box">
            <label for="audioUpload" class="audio-label" id="audioLabel">🎵 Upload Background Music</label>
            <input type="file" id="audioUpload" accept="audio/*">
            <audio id="audioPlayer" controls loop></audio>
        </div>

        <!-- Interactive Top Control Bar -->
        <div class="top-controls">
            <span class="progress-text" id="progressText">🌷 Explored: 0 / 5</span>
            <div class="control-buttons">
                <button class="mini-btn" onclick="openAll()">📖 Open All</button>
                <button class="mini-btn" onclick="closeAll()">📕 Close All</button>
                <button class="mini-btn" onclick="flowerShower(event)">💐 Flower Shower</button>
            </div>
        </div>
        
        <div class="options-container">
            <!-- Option 1 -->
            <div class="option-box" id="opt1">
                <button class="btn" onclick="toggleOption(event, 'opt1')">
                    <span>🌷 Option 1: Sincere Apology</span>
                    <span class="arrow">▾</span>
                </button>
                <div class="hidden-content">
                    <p id="text-opt1">"I am truly sorry for my mistake earlier. I realize my actions caused trouble, and I want to make things right between us."</p>
                    <div class="action-row">
                        <button class="copy-btn" onclick="copyText('text-opt1', this)">📋 Copy Message</button>
                        <button class="heart-btn" onclick="toggleLike(event, this)">🤍 Favorite</button>
                    </div>
                </div>
            </div>

<body></body>
<footer></footer>
